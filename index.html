<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markarth Property Ledger</title>
<link rel="icon" href="https://i.ibb.co/SwJFqGz6/Wahwah.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg: #0e0f0f;
  --bg2: #141516;
  --bg3: #1a1b1c;
  --card: #141515;
  --card2: #1a1a1a;
  --card3: #1f1f1f;
  --text: #c8c4bb;
  --text2: #9e9990;
  --muted: #77746c;
  --gold: #b89b5a;
  --gold2: #8a7340;
  --gold3: #6b5a34;
  --gold4: #4a3d22;
  --red: #8c3a3a;
  --red2: #4d2222;
  --green: #2d4a2d;
  --green2: #1c331c;
  --teal: #5a7a7a;
  --border: #2a2a2a;
  --border2: #1f1f1f;
  --border3: #2f2f2f;
  --ink: #2a2520;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Segoe UI', sans-serif;
  min-height: 100vh;
  line-height: 1.55;
}

.login-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: radial-gradient(ellipse at top, rgba(184,155,90,.05), transparent 60%), #0e0f0f;
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--green);
  padding: 42px 34px;
  width: 420px;
  max-width: 94%;
  box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.02);
  position: relative;
}
.login-box::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid var(--border2);
  pointer-events: none;
}
.login-box h1 {
  margin: 0;
  font-family: 'Cinzel', serif;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 1.8px;
  text-transform: uppercase;
}
.login-box p {
  color: var(--muted);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  margin-top: -6px;
  margin-bottom: 18px;
}

input, textarea, select {
  width: 100%;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 11px 12px;
  margin: 0 0 14px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--gold2);
  box-shadow: 0 0 0 1px var(--gold3), inset 0 0 12px rgba(184,155,90,.04);
}

button {
  background: var(--gold2);
  color: #0f0d07;
  border: 1px solid var(--gold3);
  border-radius: 2px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 600;
  margin: 4px 4px 4px 0;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  letter-spacing: .6px;
  text-transform: uppercase;
}
button:hover { background: var(--gold); color: #0c0a05; }
button.small { padding: 5px 10px; font-size: 10px; letter-spacing: .5px; }
button.ghost {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
  text-transform: none;
  letter-spacing: .2px;
}
button.ghost:hover { background: var(--card2); color: var(--text); border-color: var(--border3); }
button.alert { background: var(--red2); color: #d6c4c4; border-color: #3a1f1f; }
button.alert:hover { background: var(--red); color: #fff; }
button.amber { background: var(--gold4); color: #1a1810; border-color: var(--gold3); }
button.amber:hover { background: var(--gold2); color: #0f0d08; }

.muted { color: var(--muted); font-size: 12px; }

.tag {
  display: inline-block;
  padding: 4px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--gold3);
  border-radius: 1px;
  font-size: 10px;
  margin-right: 5px;
  margin-bottom: 5px;
  color: var(--muted);
  letter-spacing: .6px;
  text-transform: uppercase;
  font-weight: 500;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--green2);
  border-bottom: 1px solid var(--green);
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.topbar h1 {
  margin: 0;
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}
.topbar .actions { display: flex; gap: 8px; align-items: center; font-size: 12px; }

.container { padding: 24px 28px; max-width: 1500px; margin: 0 auto; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
  gap: 14px;
}
.item {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 1px solid var(--border3);
  border-radius: 2px;
  padding: 18px;
  position: relative;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,155,90,.25), transparent);
}
.item .hdr {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.item .hdr .name {
  font-family: 'Cinzel', serif;
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
  letter-spacing: .4px;
}
.item .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; border-bottom: 1px dashed var(--border); }
.item .row:last-child { border-bottom: none; }
.item .row .k { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .8px; font-weight: 500; }

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 1px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: 1px solid;
}
.badge.ok { background: #14261b; color: #7da87d; border-color: #1f3d2b; }
.badge.no { background: #261414; color: #c28a8a; border-color: #3d1f1f; }

.notes {
  margin-top: 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--gold3);
  border-radius: 1px;
  padding: 12px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  min-height: 42px;
}
.notes .nhead { color: var(--muted); font-family: 'Inter', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 6px; font-weight: 500; }
.notes textarea { min-height: 54px; margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 14px; resize: vertical; background: transparent; color: var(--text); line-height: 1.5; }

.price { color: var(--gold); font-weight: 500; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; }

.actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }

.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex;
  align-items: center; justify-content: center; z-index: 20;
}
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--gold);
  border-radius: 2px;
  padding: 26px 24px;
  width: 460px;
  max-width: 94%;
  box-shadow: 0 20px 60px rgba(0,0,0,.65);
  position: relative;
}
.modal::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid var(--border2);
  pointer-events: none;
}
.modal h2 {
  margin-top: 0;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.hidden { display: none !important; }

.sheet {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.sheet thead th {
  background: var(--green2);
  color: var(--gold);
  border-bottom: 1px solid var(--green);
  padding: 10px 12px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 600;
  text-transform: uppercase;
  white-space: nowrap;
}
.sheet tbody tr {
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.sheet tbody tr:hover {
  background: var(--card2);
}
.sheet tbody tr.house-row {
  background: #161a1a;
  border-top: 1px solid #2a2520;
}
.sheet tbody tr.house-row:first-child {
  border-top: none;
}
.sheet tbody tr.notes-row td {
  background: #101111;
}
.sheet tbody tr.house-row td {
  padding: 14px;
  border-bottom: 2px solid #232525;
}
.sheet tbody tr.house-row td:first-child {
  border-left: 3px solid var(--gold3);
  padding-left: 11px;
}
.sheet tbody tr.house-row:hover td {
  background: #1c2020;
}
.sheet .name {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: .3px;
}
.mr { margin-right: 6px; }
.sheet tbody tr.house-row td:first-child {
  border-left: 3px solid var(--gold3);
  padding-left: 11px;
}
.sheet .owner {
  color: var(--text2);
}
.sheet .type-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--gold);
}
.sheet .location-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--text);
  border: 1px solid var(--border3);
  padding: 3px 8px;
  border-radius: 2px;
  display: inline-block;
}
.sheet .storage {
  color: var(--text2);
  text-align: center;
}
.sheet .rent {
  color: var(--gold);
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
}
.sheet .actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.sheet .actions button {
  padding: 3px 7px;
  font-size: 9px;
}
.sheet .badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 1px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  border: 1px solid;
}
.sheet .badge.ok { background: #14261b; color: #7da87d; border-color: #1f3d2b; }
.sheet .badge.no { background: #261414; color: #c28a8a; border-color: #3d1f1f; }

.notes-row .nhead { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
.notes-row textarea {
  width: 100%;
  min-height: 36px;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 6px 8px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  resize: vertical;
}

.week-select {
  padding: 8px;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--gold3);
  border-radius: 2px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
}

.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  margin-bottom: 6px;
}

.guild-tag { color: var(--gold); font-weight: 500; }

.toggle-paid, .toggle-late {
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.toggle-paid input, .toggle-late input { display: none; }
.toggle-paid .box, .toggle-late .box {
  width: 12px; height: 12px;
  border: 1px solid var(--border3);
  background: var(--bg2);
  display: inline-block;
}
.toggle-paid input:checked + .box { background: var(--green); border-color: var(--green); }
.toggle-late input:checked + .box { background: var(--gold2); border-color: var(--gold2); }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border: 1px solid var(--bg); }

.notes-row.hidden-note { display: none !important; }
.notes-row.collapsed .note-body { display: none; }
.note-body { display: block; }
.notes-toggle {
  background: none;
  border: none;
  color: var(--gold);
  cursor: pointer;
  font: 12px Inter,sans-serif;
  letter-spacing: .6px;
  text-transform: uppercase;
}
.unowned-tag {
  border: 1px solid var(--text2);
  color: var(--muted);
  padding: 3px 8px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
  border-radius: 2px;
}
.weeks-paid-badge {
  font-size: 11px;
  color: var(--gold);
  border: 1px solid var(--gold3);
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: .6px;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
}
.status-actions {
  display:flex;
  flex-direction:row;
  gap:8px;
  align-items:center;
}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
      <img src="https://i.ibb.co/SwJFqGz6/Wahwah.png" alt="crest" style="width:52px;height:52px;border-radius:50%;border:1px solid var(--gold3);">
      <h1 style="margin:0;font-family:'Cinzel',serif;font-size:20px;color:var(--gold);letter-spacing:1.8px;text-transform:uppercase;">Markarth Property Ledger</h1>
    </div>
    <p class="muted" style="font-size:12px;">Property records, tenancy, and annotations.</p>
    <input type="password" id="loginPass" placeholder="Provide passkey..." autocomplete="current-password">
    <button onclick="doLogin()" style="width:100%;">Access Ledger</button>
    <p class="muted" id="loginErr" style="font-size:11px;color:var(--red);min-height:18px;margin:6px 0 0;"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="https://i.ibb.co/SwJFqGz6/Wahwah.png" alt="crest" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--gold3);">
      <h1 style="margin:0;">Markarth Property Ledger</h1>
    </div>
    <div class="actions">
      <span class="muted">Week:</span>
      <select id="currentWeek" class="week-select" onchange="changeWeek()"></select>
      <input id="searchInput" placeholder="Search..." oninput="render()" style="padding:8px;background:var(--bg2);color:var(--text);border:1px solid var(--gold3);border-radius:2px;font-size:12px;font-family:'Inter',sans-serif;width:160px;">
      <button class="small" onclick="markAllPaidCurrentWeek()">✓ Pay All This Week</button>
      <button class="small ghost" onclick="showAddHouse()">+ Add Housing</button>
      <button class="small ghost" onclick="exportJSON()">⬇ Export</button>
    </div>
  </div>

  <div class="container">
    <div class="toolbar">
      <button class="small" onclick="showAddHouse()">+ Add Property</button>
      <button class="small ghost" onclick="toggleAllNotes(noteFilterAll=false)">Collapse Notes</button>
      <button class="small ghost" onclick="toggleAllNotes(noteFilterAll=true)">Expand Notes</button>
      <button class="small ghost" onclick="exportJSON()">Export</button>
    </div>
    <div style="overflow:auto; border:1px solid var(--border); margin-top:12px;">
      <table class="sheet">
        <thead>
          <tr>
            <th>STATUS</th>
            <th>PROPERTY</th>
            <th>OWNER</th>
            <th>TYPE</th>
            <th>STORAGE</th>
            <th>DATE ADDED</th>
            <th>DUE DATE</th>
            <th>LOCATION</th>
            <th>WKS PAID</th>
            <th>WEEKLY RENT</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="housesBody"></tbody>
      </table>
    </div>
    <p id="emptyState" class="hidden muted" style="text-align:center;padding:30px;">No properties recorded. Add the first entry above.</p>
  </div>
</div>
</div>

<div id="addModal" class="modal-mask hidden" onclick="if(event.target===this)hideAddModal()">
  <div class="modal">
    <h2 id="modalTitle">Add Property</h2>
    <input id="fName" placeholder="Property name (e.g. Cloudspire 4B)">
    <input id="fOwner" placeholder="Owner name (e.g. Kael)">
    <input id="fRent" type="number" min="0" step="1" placeholder="Weekly rent (G)">
    <input id="fStor" type="number" min="0" step="1" placeholder="Storage units (0 if none)">
    <label class="muted" style="font-size:11px;">Ownership type:</label>
    <select id="fGuild">
      <option value="personal">Personal</option>
      <option value="faction">Faction</option>
      <option value="unowned">Unowned</option>
    </select>
    <input id="fGuildName" placeholder="Faction name (leave blank if personal)">
    <label class="muted" style="font-size:11px;">Location:</label>
    <select id="fLocation">
      <option value="in city">In City</option>
      <option value="in reach">In Reach</option>
    </select>
    <label class="muted" style="font-size:11px;">Date Added:</label>
    <input id="fDateAdded" type="date" value="">
    <label class="muted" style="font-size:11px;">Due Date (weekly):</label>
    <input id="fDueDate" type="date" value="">
    <label class="muted" style="font-size:11px;">Weeks Advanced Paid:</label>
    <input id="fPrepaidWeeks" type="number" min="0" step="1" value="0" placeholder="0">
    <input id="editId" type="hidden" value="">
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px;">
      <button class="ghost" onclick="hideAddModal()">Cancel</button>
      <button id="saveBtn" onclick="saveHouse()">Save</button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
// Password for login
const PASS = "MarkarthADMIN2026";
// Firebase config — replace these values with the new project's config
const firebaseConfig = {
  apiKey: "AIzaSyD9KifRmH5Ze0WGM2Ynxi9WWgXt5Jnxp7Q",
  authDomain: "markarth-ledger.firebaseapp.com",
  databaseURL: "https://markarth-ledger-default-rtdb.firebaseio.com",
  projectId: "markarth-ledger",
  storageBucket: "markarth-ledger.firebasestorage.app",
  messagingSenderId: "318365176661",
  appId: "1:318365176661:web:a42e5a7e4fef80dcf6d5dc",
  measurementId: "G-WH8DZZNJY4"
};

// Compat SDKs
const firebaseScripts = [
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"
];

// ==================== STATE ====================
let db = null;
let data = null;
let currentWeek = getWeekKey(Date.now());
let weekListeners = [];
let TIMEOUT = null;
const LS_KEY = "propertyLedger_data";
let editingId = null;
const collapsedNotes = new Set();
let allNotesCollapsed = false;

// ==================== AUTH ====================
function doLogin() {
  const pw = document.getElementById("loginPass").value;
  if (pw === PASS) {
    localStorage.setItem("ledger_auth", "1");
    initApp();
  } else {
    document.getElementById("loginErr").textContent = "Incorrect password.";
  }
}
if (localStorage.getItem("ledger_auth") === "1") document.getElementById("loginPass").value && setTimeout(initApp, 50);
window.addEventListener("load", () => {
  if (localStorage.getItem("ledger_auth") === "1") initApp();
});

// ==================== INIT ====================
function initApp() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadLocalData();
  buildWeekSelect();
  loadFirebase().then(() => { scheduleSaturdaySync(); render(); }).catch(() => render());
}

// ==================== LOCAL / FIREBASE ====================
function loadLocalData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const houses = (parsed.houses || []).map(h => ({ ...h, dateAdded: h.dateAdded || "—", location: h.location || "in city", dueDate: h.dueDate || "", prepaidWeeks: h.prepaidWeeks || 0 }));
      data = { houses, payments: parsed.payments || {}, notes: parsed.notes || {}, version: parsed.version || 1 };
      return;
    }
  } catch (e) { console.warn("localStorage load failed", e); }
  // default
  data = {
    houses: [],
    payments: {},
    notes: {},
    version: 1
  };
  ensureWeek(currentWeek);
  data.houses.forEach(h => {
    data.payments[currentWeek][h.id] = { paid: false, updatedAt: Date.now() };
    data.notes[h.id] = "";
  });
}

function saveLocalData() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
}

function loadFirebase() {
  return new Promise((resolve, reject) => {
    if (!firebaseConfig.databaseURL) { reject(new Error("No Firebase config")); return; }
    if (window.firebase && window.firebase.database) { resolve(); return; }
    let s = 0;
    function check() {
      if (s >= firebaseScripts.length) { resolve(); return; }
      const scr = document.createElement("script");
      scr.src = firebaseScripts[s];
      scr.onerror = reject;
      scr.onload = () => { s++; check(); };
      document.head.appendChild(scr);
    }
    check();
  }).then(() => {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      startSync();
      return true;
    } catch (e) {
      console.warn("Firebase not ready:", e);
      return false;
    }
  }).catch(e => { console.warn("Firebase disabled:", e); return false; });
}

function startSync() {
  if (!db) return;
  const ref = db.ref("propertyLedger");
  ref.on("value", (snap) => {
    if (snap.exists()) {
      const v = snap.val();
      if (JSON.stringify(v) !== JSON.stringify(data)) {
        data = v;
        saveLocalData();
        render();
      }
    } else {
      if (data && data.houses && data.houses.length) {
        db.ref("propertyLedger").set(data);
      } else {
        render();
      }
    }
  });
}



function pushData() {
  if (db) { debouncedPush(); return; }
  saveLocalData();
}

function debouncedPush() {
  if (TIMEOUT) clearTimeout(TIMEOUT);
  TIMEOUT = setTimeout(() => {
    if (db) db.ref("propertyLedger").set(data);
  }, 400);
}

function saveLocalAndMaybeSync() {
  saveLocalData();
  if (db) {
    db.ref("propertyLedger").set(data);
  }
}

// ==================== HELPERS ====================
function h1() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function getWeekKey(t) {
  const d = new Date(t);
  const day = d.getDay() || 7;
  if (day > 4) d.setDate(d.getDate() + (8 - day)); // Friday reset
  else d.setDate(d.getDate() + (5 - day));
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function fmtG(n) { return n + " G"; }
function parseIntSafe(v) { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

// ==================== WEEK ====================
function buildWeekSelect() {
  const sel = document.getElementById("currentWeek");
  sel.innerHTML = "";
  // build last 8 weeks
  const base = new Date(); base.setHours(0,0,0,0);
  const day = base.getDay() || 7;
  const friday = new Date(base);
  friday.setDate(base.getDate() + (5 - day));
  for (let i = 0; i < 8; i++) {
    const f = new Date(friday);
    f.setDate(f.getDate() - (i * 7));
    const key = f.toISOString().slice(0,10);
    const opt = document.createElement("option");
    opt.value = key;
    opt.selected = key === currentWeek;
    opt.textContent = "Week of " + key;
    sel.appendChild(opt);
  }
}
function changeWeek() {
  currentWeek = document.getElementById("currentWeek").value;
  render();
}
function scheduleSaturdaySync() {
  const now = new Date();
  const cst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
  const day = cst.getDay();
  const diff = (6 - day + 7) % 7;
  const target = new Date(cst);
  target.setDate(cst.getDate() + diff);
  target.setHours(0, 0, 0, 0);
  const ms = target - cst;
  setTimeout(() => {
    saveLocalAndMaybeSync();
    setInterval(saveLocalAndMaybeSync, 7 * 24 * 60 * 60 * 1000);
  }, ms);
}
function markAllPaidCurrentWeek() {
  ensureWeek(currentWeek);
  data.houses.forEach(h => {
    data.payments[currentWeek][h.id] = { paid: true, updatedAt: Date.now() };
  });
  saveLocalAndMaybeSync();
  render();
}
function getPaidCount(houseId) {
  let count = 0;
  Object.keys(data.payments).forEach(w => {
    const p = (data.payments[w] && data.payments[w][houseId]) || null;
    if (p && p.paid) count++;
  });
  return count;
}

// ==================== MODALS ====================
function showAddHouse() { document.getElementById("addModal").classList.remove("hidden"); }
function hideAddModal() {
  document.getElementById("addModal").classList.add("hidden");
  ["fName","fOwner","fRent","fStor","fGuild","fGuildName","fLocation","fDateAdded","fDueDate"].forEach(x => document.getElementById(x).value = "");
  document.getElementById("modalTitle").textContent = "Add Property";
  document.getElementById("saveBtn").textContent = "Save";
  document.getElementById("saveBtn").onclick = saveHouse;
  document.getElementById("editId").value = "";
}
function saveHouse() {
  const name = document.getElementById("fName").value.trim();
  const owner = document.getElementById("fOwner").value.trim();
  const rent = parseIntSafe(document.getElementById("fRent").value);
  const storage = parseIntSafe(document.getElementById("fStor").value);
  const ownership = document.getElementById("fGuild").value;
  const factionName = ownership === "faction" ? document.getElementById("fGuildName").value.trim() : "";
  const location = document.getElementById("fLocation").value;
  const dateAdded = document.getElementById("fDateAdded").value || new Date().toISOString().slice(0,10);
  const dueDate = document.getElementById("fDueDate").value || "";
  const prepaidWeeks = parseIntSafe(document.getElementById("fPrepaidWeeks").value);
  if (!name || (ownership !== "unowned" && !owner)) { alert("Name is required."); return; }
  if (editingId) {
    const house = data.houses.find(h => h.id === editingId);
    if (house) Object.assign(house, { name, owner, rent, storage, ownership, factionName, location, dateAdded, dueDate, prepaidWeeks });
  } else {
    data.houses.push({ id: h1(), name, owner, rent, storage, ownership, factionName, location, dateAdded, dueDate, prepaidWeeks: prepaidWeeks || 0 });
  }
  editingId = null;
  saveLocalAndMaybeSync();
  hideAddModal();
  render();
}
function editHouse(id) {
  const house = data.houses.find(h => h.id === id);
  if (!house) return;
  editingId = id;
  document.getElementById("fName").value = house.name;
  document.getElementById("fOwner").value = house.owner;
  document.getElementById("fRent").value = house.rent;
  document.getElementById("fStor").value = house.storage;
  document.getElementById("fGuild").value = house.ownership || "personal";
  document.getElementById("fGuildName").value = house.factionName || "";
  document.getElementById("fLocation").value = house.location || "in city";
  document.getElementById("fDateAdded").value = house.dateAdded || "";
  document.getElementById("fDueDate").value = house.dueDate || "";
  document.getElementById("fPrepaidWeeks").value = house.prepaidWeeks || 0;
  document.getElementById("modalTitle").textContent = "Edit Property";
  document.getElementById("saveBtn").textContent = "Update";
  document.getElementById("saveBtn").onclick = saveHouse;
  showAddHouse();
}

// ==================== PAYMENTS ====================
function togglePaid(id) {
  ensureWeek(currentWeek);
  const current = (data.payments[currentWeek] && data.payments[currentWeek][id]) || null;
  const paid = !(current && current.paid);
  data.payments[currentWeek][id] = { paid, updatedAt: Date.now() };
  saveLocalAndMaybeSync();
  render();
}

function markWeekLate(id) {
  ensureWeek(currentWeek);
  const current = (data.payments[currentWeek] && data.payments[currentWeek][id]) || null;
  const late = !(current && current.late);
  data.payments[currentWeek][id] = { paid: false, late, updatedAt: Date.now() };
  saveLocalAndMaybeSync();
  render();
}

function deleteHouse(id) {
  if (!confirm("Delete this property and all notes?")) return;
  data.houses = data.houses.filter(h => h.id !== id);
  if (data.notes[id]) delete data.notes[id];
  Object.keys(data.payments).forEach(w => {
    if (data.payments[w][id]) delete data.payments[w][id];
  });
  saveLocalAndMaybeSync();
  render();
}

function ensureWeek(key) {
  if (!data.payments[key]) data.payments[key] = {};
}

// ==================== NOTES ====================
function saveNote(id, text) {
  data.notes[id] = text;
  saveLocalAndMaybeSync();
}
function toggleNote(id) {
  if (collapsedNotes.has(id)) collapsedNotes.delete(id); else collapsedNotes.add(id);
  render();
}
function toggleAllNotes(show) {
  allNotesCollapsed = !show;
  render();
}
function filteredResults() {
  const houses = data.houses.slice().sort((a,b) => a.name.localeCompare(b.name));
  const s = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  if (!s) return houses;
  return houses.filter(h => [h.name, h.owner, h.ownership, h.factionName, h.location, "" + h.storage, "" + h.rent, h.dateAdded, h.dueDate || "", "" + (h.prepaidWeeks || 0)].some(x => String(x).toLowerCase().includes(s)));
}

// ==================== RENDER ===================
function render() {
  const tbody = document.getElementById("housesBody");
  const empty = document.getElementById("emptyState");
  const houses = data.houses.slice().sort((a,b) => a.name.localeCompare(b.name));
  if (!houses.length) { tbody.innerHTML = ""; empty.classList.remove("hidden"); return; }
  empty.classList.add("hidden");

  const pmts = data.payments[currentWeek] || {};
  const s = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const filtered = houses.filter(h => {
    if (!s) return true;
    return [h.name, h.owner, h.ownership, h.factionName, h.location, "" + h.storage, "" + h.rent, h.dateAdded, h.dueDate || "", "" + (h.prepaidWeeks || 0)].some(x => String(x).toLowerCase().includes(s));
  });
  const rows = [];
  filtered.forEach((h, i) => {
    const p = pmts[h.id] || { paid: false, late: false };
    const payChecked = p.paid ? "checked" : "";
    const lateChecked = p.late ? "checked" : "";
  const typeDisplay = h.ownership === "faction" ? `FACTION${h.factionName ? ' · ' + esc(h.factionName) : ''}` : (h.ownership === "unowned" ? `<span class="unowned-tag">Unowned</span>` : "PERSONAL");
    const noteHidden = allNotesCollapsed && h.ownership !== 'unowned' ? "collapsed" : "";
    const noteLabel = (allNotesCollapsed && h.ownership !== 'unowned') ? "Annotations ▸" : "Annotations ▾";
    const paidCount = getPaidCount(h.id);
    rows.push(`<tr class="house-row">
      <td class="status entry-cell">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <label class="toggle-paid" title="Paid">
            <input type="checkbox" ${payChecked} onchange="togglePaid('${h.id}')" ${h.ownership === 'unowned' ? 'disabled' : ''}>
            <span class="box"></span>
            ${h.ownership === 'unowned' ? '<span style="font-size:10px;color:var(--muted);">—</span>' : '<span style="font-size:10px;color:var(--muted);">Paid</span>'}
          </label>
          <label class="toggle-late" title="Late">
            <input type="checkbox" ${lateChecked} onchange="markWeekLate('${h.id}')" ${h.ownership === 'unowned' ? 'disabled' : ''}>
            <span class="box"></span>
            ${h.ownership === 'unowned' ? '<span style="font-size:10px;color:var(--muted);">—</span>' : '<span style="font-size:10px;color:var(--muted);">Late</span>'}
          </label>
        </div>
      </td>
      <td class="name"><span class="muted mr">#${i + 1}</span>${esc(h.name)}</td>
      <td class="owner">${esc(h.ownership === 'unowned' ? '—' : h.owner)}</td>
      <td class="type-tag">${typeDisplay}</td>
      <td class="storage">${h.storage}</td>
      <td>${h.dateAdded || "—"}</td>
      <td>${h.dueDate ? h.dueDate : '<span class="muted">—</span>'}</td>
      <td><span class="location-tag">${esc(h.location || "in city")}</span></td>
      <td class="storage">${h.prepaidWeeks || 0}</td>
      <td class="rent">${fmtG(h.rent)}</td>
      <td class="actions">
        <button class="small amber" onclick="editHouse('${h.id}')">Edit</button>
        <button class="small alert" onclick="deleteHouse('${h.id}')">Delete</button>
      </td>
    </tr>`);
    rows.push(`<tr class="notes-row ${h.ownership === 'unowned' ? 'hidden-note' : noteHidden}" id="note-${h.id}">
      <td colspan="11" style="padding:0 12px 12px;">
        <span class="nhead" style="cursor:pointer;" onclick="toggleNote('${h.id}')">${noteLabel}</span>
        <div class="note-body">
          <button class="weeks-paid-badge" onclick="alert('Weeks paid: ' + getPaidCount('${h.id}'))">Paid: ${paidCount}</button>
          <textarea onblur="saveNote('${h.id}', this.value)" placeholder="Notes...">${esc(data.notes[h.id] || "")}</textarea>
        </div>
      </td>
    </tr>`);
  });
  tbody.innerHTML = rows.join("");
}

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===================== EXPORT ===================
function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "property-ledger-" + currentWeek + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
